# Alerts for the failures nothing else reports.
#
# STATUS: this is where the rules are AUTHORED. It is not what the box loads.
# sparkup vendors a copy as roles/sparks/files/sparks.yml, validates it with
# promtool, and installs it into a rule_files directory; a change here reaches a
# box only once it is copied there and the play is re-run. Provisioning does not
# reach a git remote on purpose, so the duplication is deliberate.
#
# On a provisioned box these are evaluated but NOT routed: there is no
# Alertmanager, so nothing pages. Their state is visible in Prometheus's /rules
# and queryable as ALERTS{alertname="..."}. "Firing" means a series says so and
# somebody has to look at it.
#
# sparkup's INSTALL_CLAUDE.md says a non-world-readable .prom fails silently.
# That is wrong: it sets node_textfile_scrape_error 1. The genuinely silent
# failures are below, and the first one is the reason this file exists.
groups:
  - name: sparks
    rules:
      - alert: SparksRunIndexEmpty
        # An empty or headers-only .prom reports scrape_error 0, a FRESH mtime,
        # and zero series. Total data loss with every health signal green.
        # Nothing in node_exporter reports it; this rule is the only defence.
        #
        # CAVEAT: absent() also fires on a fresh box that has simply never
        # completed a run, which is indistinguishable from the box being down.
        # Do not page on this without a "box has run before" precondition.
        expr: absent(sparks_run_info)
        for: 15m
        annotations:
          summary: "The run index is empty or unreadable"

      - alert: SparksTextfileError
        # Catches unparseable, unreadable, timestamped, or missing-newline
        # files. Note there is no `file` label, so this says something broke
        # without saying what.
        #
        # The job label matches the second scrape job in sparkup's
        # roles/monitoring/templates/prometheus.yml.j2, the slow one that
        # collects only the textfile collector. Renaming that job silences this
        # rule, and nothing would report that it had gone quiet.
        expr: node_textfile_scrape_error{job="node_textfile"} > 0
        for: 15m
        annotations:
          summary: "node_exporter could not read a textfile collector file"

      - alert: SparksDuplicateSeries
        # A duplicate series within one file, or across two files with matching
        # HELP, is dropped by the gatherer with scrape_error still 0. This
        # counter is the only place it surfaces.
        #
        # increase(...) > 0 with NO `for`, not rate(...) > 0 with `for: 15m`:
        # a single error keeps rate() positive for exactly 15 minutes, so the
        # pending window expires as the condition does and the alert never
        # fires. increase() over the window catches the one error outright.
        expr: increase(promhttp_metric_handler_errors_total{cause="gathering"}[15m]) > 0
        annotations:
          summary: "node_exporter is dropping duplicate series"
