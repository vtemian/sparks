[project]
name = "sparks"
version = "0.1.0"
description = "Training runs on the DGX Spark: metrics, launcher, queue"
requires-python = ">=3.12"
dependencies = [
    "prometheus-remote-writer>=1.1.3",
    # NVML, for the GPU energy counter. Optional at runtime: energy.py imports
    # it lazily and degrades to zero, because development happens where there
    # is no GPU and a box may have no monitoring at all.
    "nvidia-ml-py>=12.560",
    "docker>=7.2.0",
]

[project.scripts]
sparks = "sparks.client.cli:main"
fire = "sparks.fire.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.13",
    "ruff>=0.8",
    "requests>=2.32",
    "types-requests>=2.32",
    "types-docker>=7.2.0.20260806",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sparks"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# N = pep8-naming (class/function shape). Single-letter locals (VNE001) and
# letter-suffix abbreviations (submit_p) are not in ruff yet; tests/check_names.py
# is the rule, wired into `make lint`.
select = [
    "F", "E", "W", "I", "B", "C4", "UP", "SIM", "S", "T20",
    "N", "ANN", "A", "ARG", "ERA", "PLR", "PLW", "PLE", "PERF",
    "RUF", "TRY", "BLE", "EM", "C90", "RET", "TC", "PIE",
]
ignore = [
    "TRY003",             # long messages at the raise are the house style
    "EM101", "EM102",     # and they are raw or f-strings, deliberately
    "PLR0913", "PLR0917", # wide signatures are deliberate. Both twins: PLR0913
                          # counts every argument and PLR0917 only the
                          # positional ones, so ignoring PLR0913 alone would
                          # leave its subset still failing
    "S603", "S607",       # subprocess is this tool's job: argv is always a list
                          # and shell=True never appears; ssh, git and rsync
                          # resolve via PATH on purpose. ssh_argv still hands a
                          # shlex-quoted string to the REMOTE shell by design,
                          # which is not what S603 measures.
]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.pylint]
max-branches = 4
max-returns = 4
max-statements = 15

[tool.ruff.lint.per-file-ignores]
# Test modules: assertions, fixture arity, magic numbers, long arranges.
"tests/**" = [
    "ANN401",  # a monkeypatch or a **kwargs bag genuinely takes Any. The rest
               # of ANN stays on: the suite is fully annotated today and a
               # blanket ignore would quietly license new untyped helpers.
    "ARG",     # a fixture is requested by name rather than used by name, and a
               # stub or lambda takes the arity of the thing it stands in for
    "PLR2004", # magic values ARE the assertion
    "PLR0915", # a long arrange/act/assert is one thought
    "S101",    # assert
    "S108",    # "/tmp/..." literals are argparse fixtures; nothing is created
]
# Makefile-invoked CLI scripts that live in tests/, not test modules.
"tests/check_dashboard.py" = ["C901", "PLR0912", "T201"]
"tests/check_names.py" = ["T201"]
"tests/check_banners.py" = ["T201"]
"tests/on_box.py" = ["BLE001", "C901", "PLR0912", "T201"]
# The CLI surface prints; that is its output contract.
"src/sparks/client/cli.py" = ["T201"]
"src/sparks/client/remote.py" = ["T201"]
"src/sparks/fire/cli.py" = ["T201"]
"src/sparks/fire/ctl.py" = ["T201"]
"src/sparks/fire/supervise.py" = ["T201"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = ["live: needs a real Prometheus (make live)"]
