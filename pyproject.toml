[project]
name = "sparks"
version = "0.1.0"
description = "Training runs on the DGX Spark: metrics, launcher, queue"
requires-python = ">=3.12"
dependencies = [
    "prometheus-remote-writer>=1.1.3",
    # NVML, for the GPU energy counter. Optional at runtime: energy.py imports
    # it lazily and degrades to zero, because development happens where there
    # is no GPU and a box may have no monitoring at all.
    "nvidia-ml-py>=12.560",
]

[project.scripts]
sparks = "sparks.client.cli:main"
sparks-runner = "sparks.runner_main:main"
sparks-run = "sparks.run_main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.13",
    "ruff>=0.8",
    "requests>=2.32",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sparks"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = ["live: needs a real Prometheus (make live)"]
